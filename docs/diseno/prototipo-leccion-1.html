<style>
/* Layout: una sola columna de celular (máx. 480px), barra fija abajo; mundo de islas sobre cielo claro. Un solo tema a propósito (juego infantil). */
:root {
  --cielo: #e6f3ff;
  --cielo2: #d3eaff;
  --tinta: #1b2340;
  --tinta2: #4a5578;
  --bit: #2ec4d6;
  --sol: #ffc531;
  --rosa: #ff5c8a;
  --hoja: #2fcf85;
  --uva: #7b61ff;
  --blanco: #ffffff;
  --sombra: #b8d3ee;
  --mal: #ff7a59;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --r: 22px;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--cielo);
  background-image: radial-gradient(var(--cielo2) 2px, transparent 2.5px);
  background-size: 26px 26px;
  color: var(--tinta);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.4;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--uva); outline-offset: 3px; }
.app {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 110px;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; text-wrap: balance; }

/* Barra de arriba */
.top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.logo { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; letter-spacing: -.01em; }
.logo b { color: var(--uva); }
.pills { display: flex; gap: 6px; }
.pill { background: var(--blanco); border-radius: 999px; padding: 4px 12px; font-weight: 800; box-shadow: 0 3px 0 var(--sombra); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Racha semanal */
.semana { margin-top: 12px; background: var(--blanco); border-radius: var(--r); padding: 12px 14px; box-shadow: 0 4px 0 var(--sombra); display: flex; align-items: center; gap: 12px; }
.semana .txt { flex: 1; min-width: 0; font-weight: 700; font-size: .95rem; }
.semana .txt small { display: block; color: var(--tinta2); font-weight: 600; }
.dias { display: flex; gap: 4px; }
.dia { width: 26px; height: 26px; border-radius: 50%; background: var(--cielo); display: grid; place-items: center; font-size: .72rem; font-weight: 800; color: var(--tinta2); }
.dia.si { background: var(--sol); color: var(--tinta); }

/* Mapa */
.mundo { margin-top: 18px; border-radius: 28px; padding: 18px 16px 22px; background: linear-gradient(180deg, #fff7dc, #ffe9a8); box-shadow: 0 5px 0 #f1cf6e; position: relative; overflow: hidden; }
.mundo-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.mundo-cab h2 { font-size: 1.5rem; }
.mundo-cab p { margin: 2px 0 0; color: var(--tinta2); font-weight: 700; font-size: .92rem; }
.etq { font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--hoja); color: #053b22; white-space: nowrap; }
.etq.fam { background: var(--uva); color: #fff; }
.camino { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 14px; }
.nodo { display: flex; align-items: center; gap: 12px; width: 100%; }
.nodo:nth-child(4n+2) { padding-left: 22%; }
.nodo:nth-child(4n+3) { padding-left: 40%; }
.nodo:nth-child(4n+4) { padding-left: 18%; }
.bola { width: 72px; height: 72px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 2rem; background: var(--blanco); box-shadow: 0 6px 0 var(--sombra); transition: transform .15s; }
.bola:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sombra); }
.nodo.activo .bola { background: var(--uva); box-shadow: 0 6px 0 #5240c9; animation: latido 1.6s ease-in-out infinite; }
.nodo.hecho .bola { background: var(--sol); box-shadow: 0 6px 0 #d9a000; }
.nodo.cerrado .bola { background: #f3ead0; box-shadow: 0 6px 0 #e0d2a8; filter: grayscale(.6); }
.nodo .nom { font-weight: 800; font-size: .95rem; line-height: 1.2; min-width: 0; }
.nodo .nom small { display: block; font-weight: 700; color: var(--tinta2); font-size: .8rem; }
@keyframes latido { 50% { transform: scale(1.06); } }

.otros { display: grid; gap: 10px; margin-top: 14px; }
.otro { display: flex; align-items: center; gap: 12px; background: var(--blanco); border-radius: var(--r); padding: 12px 14px; box-shadow: 0 4px 0 var(--sombra); text-align: left; width: 100%; }
.otro .em { font-size: 1.8rem; width: 44px; text-align: center; flex: none; }
.otro .t { flex: 1; min-width: 0; font-weight: 800; }
.otro .t small { display: block; color: var(--tinta2); font-weight: 600; font-size: .82rem; }

/* Barra fija abajo */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--blanco); box-shadow: 0 -2px 0 var(--sombra); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 8px 4px 10px; font-weight: 800; font-size: .8rem; color: var(--tinta2); min-height: 62px; }
.nav button span { font-size: 1.5rem; line-height: 1.2; }
.nav button.on { color: var(--uva); }
.nav button.on span { transform: translateY(-2px) scale(1.1); }

/* Bit */
.bit svg { display: block; width: 100%; height: auto; }
.bit .ojo { animation: parpadeo 4s infinite; transform-origin: center; transform-box: fill-box; }
@keyframes parpadeo { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.bit.brinca { animation: brinco .5s ease; }
@keyframes brinco { 30% { transform: translateY(-14px); } 60% { transform: translateY(0); } 80% { transform: translateY(-5px); } }
.bit.piensa { animation: piensa .9s ease-in-out infinite; }
@keyframes piensa { 50% { transform: rotate(-5deg); } }

/* Lección */
.leccion { position: fixed; inset: 0; z-index: 40; background: var(--cielo); overflow-y: auto; }
.lec-in { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); }
.lec-top { display: flex; align-items: center; gap: 10px; }
.cerrar { width: 44px; height: 44px; border-radius: 50%; background: var(--blanco); box-shadow: 0 3px 0 var(--sombra); font-size: 1.2rem; font-weight: 800; flex: none; }
.barra { flex: 1; display: flex; gap: 4px; }
.barra i { flex: 1; height: 12px; border-radius: 99px; background: var(--blanco); box-shadow: inset 0 2px 0 var(--sombra); transition: background .3s; }
.barra i.ya { background: var(--hoja); box-shadow: none; }
.barra i.ahora { background: var(--sol); box-shadow: none; }
.escena { flex: 1; display: flex; flex-direction: column; gap: 14px; padding-top: 16px; }
.tipo { font-family: var(--font-display); font-weight: 800; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; color: var(--uva); }
.escena h2 { font-size: 1.7rem; }

.dialogo { display: flex; align-items: flex-end; gap: 10px; }
.dialogo .bit { width: 108px; flex: none; }
.dialogo.grande .bit { width: 150px; }
.globo { position: relative; flex: 1; min-width: 0; background: var(--blanco); border-radius: 22px 22px 22px 6px; padding: 14px 16px; box-shadow: 0 4px 0 var(--sombra); font-weight: 700; font-size: 1.08rem; }
.globo .hablar { position: absolute; top: -14px; right: -6px; width: 40px; height: 40px; border-radius: 50%; background: var(--sol); box-shadow: 0 3px 0 #d9a000; font-size: 1.1rem; }

.boton { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 58px; border-radius: 18px; font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; background: var(--hoja); color: #04361f; box-shadow: 0 6px 0 #1f9e63; transition: transform .1s, box-shadow .1s; }
.boton:active { transform: translateY(4px); box-shadow: 0 2px 0 #1f9e63; }
.boton:disabled { background: #d7e3ef; color: #8090ad; box-shadow: 0 6px 0 #bfcfe0; cursor: default; }
.boton.sec { background: var(--blanco); color: var(--tinta); box-shadow: 0 6px 0 var(--sombra); }
.boton.uva { background: var(--uva); color: #fff; box-shadow: 0 6px 0 #5240c9; }
.abajo { margin-top: auto; display: grid; gap: 12px; padding-top: 12px; }

/* Tarjeta de objeto y dos botones grandes */
.objeto { background: var(--blanco); border-radius: 26px; padding: 22px 16px; text-align: center; box-shadow: 0 5px 0 var(--sombra); }
.objeto .em { font-size: 4.2rem; line-height: 1.1; }
.objeto .t { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; margin-top: 6px; }
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.op { min-height: 92px; border-radius: 22px; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px; transition: transform .1s; }
.op span { font-size: 2rem; }
.op.a { background: var(--bit); color: #04323a; box-shadow: 0 6px 0 #1f97a6; }
.op.b { background: var(--sol); color: #3a2a00; box-shadow: 0 6px 0 #d9a000; }
.op:active { transform: translateY(4px); }
.op:disabled { opacity: .45; cursor: default; }

.aviso { border-radius: 20px; padding: 14px 16px; font-weight: 700; animation: sube .25s ease; }
.aviso b { font-family: var(--font-display); font-size: 1.25rem; display: block; }
.aviso.bien { background: #d6f7e7; color: #064a2a; }
.aviso.mal { background: #ffe4dc; color: #6b1d07; }
@keyframes sube { from { transform: translateY(12px); opacity: 0; } }

/* Fichas para elegir (entrenar) */
.rejilla { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.ficha { aspect-ratio: 1; max-width: 100%; border-radius: 20px; background: var(--blanco); font-size: 2.3rem; box-shadow: 0 5px 0 var(--sombra); position: relative; transition: transform .1s; }
.ficha.sel { background: #e7e1ff; box-shadow: 0 5px 0 var(--uva); transform: translateY(-2px); }
.ficha.sel::after { content: "✓"; position: absolute; top: 4px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--uva); color: #fff; font-size: .8rem; font-weight: 800; display: grid; place-items: center; font-family: var(--font-body); }
.ficha:disabled { cursor: default; }

/* Armar la orden */
.fila { display: grid; gap: 8px; }
.fila .q { font-weight: 800; font-size: .95rem; color: var(--tinta2); }
.chips { display: grid; gap: 8px; }
.chip { text-align: left; padding: 12px 14px; border-radius: 16px; background: var(--blanco); box-shadow: 0 4px 0 var(--sombra); font-weight: 700; min-height: 48px; }
.chip.sel { background: var(--uva); color: #fff; box-shadow: 0 4px 0 #5240c9; }
.orden { background: var(--tinta); color: #fff; border-radius: 18px; padding: 14px 16px; font-weight: 700; }
.orden small { display: block; color: var(--sol); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: .72rem; margin-bottom: 4px; }
.cuento { background: var(--blanco); border-radius: 18px; padding: 14px 16px; box-shadow: 0 4px 0 var(--sombra); font-weight: 600; }
.estrellas { font-size: 2rem; letter-spacing: 4px; text-align: center; }
.estrellas .no { filter: grayscale(1); opacity: .3; }

/* Carta de poder */
.carta-zona { perspective: 900px; display: grid; place-items: center; padding: 8px 0; }
.carta { width: 230px; max-width: 100%; aspect-ratio: 3 / 4; position: relative; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,1.4,.5,1); }
.carta.vuelta { transform: rotateY(180deg); }
.cara { position: absolute; inset: 0; border-radius: 24px; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 18px; }
.cara.atras { background: repeating-linear-gradient(45deg, var(--uva) 0 14px, #8d77ff 14px 28px); box-shadow: 0 8px 0 #5240c9; color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 3rem; }
.cara.frente { transform: rotateY(180deg); background: linear-gradient(160deg, #fff, #fff4cc); box-shadow: 0 8px 0 #e3b52a; border: 4px solid var(--sol); }
.cara.frente .em { font-size: 3.6rem; }
.cara.frente h3 { font-size: 1.5rem; margin: 6px 0; }
.cara.frente p { margin: 0; font-weight: 700; font-size: .95rem; color: var(--tinta2); }
.cara.frente .n { position: absolute; top: 10px; left: 14px; font-size: .75rem; font-weight: 800; color: #b38600; letter-spacing: .05em; }

/* Álbum */
.titulo-sec { margin-top: 16px; }
.titulo-sec h2 { font-size: 1.6rem; }
.titulo-sec p { margin: 2px 0 0; color: var(--tinta2); font-weight: 700; }
.album { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.mini { aspect-ratio: 3 / 4; border-radius: 16px; background: linear-gradient(160deg, #fff, #fff4cc); border: 3px solid var(--sol); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; text-align: center; box-shadow: 0 4px 0 #e3b52a; }
.mini .em { font-size: 2rem; }
.mini b { font-family: var(--font-display); font-size: .92rem; line-height: 1.1; margin-top: 4px; }
.mini.falta { background: #dfeaf6; border-color: #c7d7e8; box-shadow: 0 4px 0 #c7d7e8; color: #8a9ab7; }
.mini.falta .em { filter: grayscale(1) brightness(1.6); opacity: .45; }

/* Taller de Bit */
.taller { background: var(--blanco); border-radius: 28px; padding: 16px; margin-top: 14px; box-shadow: 0 5px 0 var(--sombra); }
.taller .bit { width: 190px; margin: 0 auto; }
.grupo { margin-top: 14px; }
.grupo .q { font-weight: 800; color: var(--tinta2); font-size: .95rem; margin-bottom: 8px; }
.colores { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.color { aspect-ratio: 1; border-radius: 50%; box-shadow: 0 4px 0 rgba(0,0,0,.15); border: 4px solid var(--blanco); }
.color.sel { outline: 4px solid var(--tinta); }
.accs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.acc { border-radius: 18px; background: var(--cielo); padding: 10px; font-weight: 800; min-height: 64px; display: flex; align-items: center; gap: 8px; text-align: left; }
.acc span { font-size: 1.6rem; }
.acc small { display: block; font-weight: 700; color: var(--tinta2); font-size: .78rem; }
.acc.sel { background: var(--uva); color: #fff; }
.acc.sel small { color: #e5deff; }
.acc.bloq { opacity: .55; }

/* Papás */
.panel { background: var(--blanco); border-radius: 24px; padding: 16px; margin-top: 14px; box-shadow: 0 5px 0 var(--sombra); }
.panel h3 { font-size: 1.25rem; margin-bottom: 8px; }
.panel ul { margin: 0; padding-left: 20px; }
.panel li { margin-bottom: 6px; font-weight: 600; }
.cuatro { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
.cifras { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.cifras div { background: var(--cielo); border-radius: 16px; padding: 10px 4px; }
.cifras b { font-family: var(--font-display); font-size: 1.7rem; display: block; line-height: 1; font-variant-numeric: tabular-nums; }
.cifras small { font-weight: 700; color: var(--tinta2); font-size: .78rem; }
.precio { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 10px 0; border-top: 2px dashed var(--cielo2); }
.precio:first-of-type { border-top: 0; }
.precio b { font-family: var(--font-display); font-size: 1.2rem; }
.precio span { color: var(--tinta2); font-weight: 700; font-size: .9rem; }

/* Diálogo propio y aviso flotante */
.velo { position: fixed; inset: 0; z-index: 60; background: rgba(27,35,64,.45); display: grid; place-items: end center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.hoja { width: 100%; max-width: 448px; background: var(--blanco); border-radius: 26px; padding: 20px 16px 16px; display: grid; gap: 12px; animation: sube .2s ease; }
.hoja h3 { font-size: 1.45rem; }
.hoja p { margin: 0; font-weight: 600; color: var(--tinta2); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--tinta); color: #fff; font-weight: 800; padding: 12px 18px; border-radius: 16px; max-width: calc(100% - 32px); text-align: center; animation: sube .2s ease; }

/* Final */
.final { text-align: center; }
.final .bit { width: 170px; margin: 0 auto; }
.gana { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
.gana .mini { width: 84px; }
.mision { background: linear-gradient(160deg, #e7e1ff, #fff); border: 3px dashed var(--uva); border-radius: 22px; padding: 14px 16px; text-align: left; font-weight: 700; }
.mision small { display: block; color: var(--uva); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: .75rem; margin-bottom: 4px; }
#confeti { position: fixed; inset: 0; pointer-events: none; z-index: 80; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

    dibujar();
  }

  function pIaONo(p, el) {
    var i = 0;
    function dibujar() {
      var it = p.items[i];
      el.innerHTML = '<div class="tipo">Minijuego · ¿IA o no IA? · ' + (i + 1) + " de " + p.items.length + "</div>" +
        globo("¿Esto es una inteligencia artificial?", "piensa") +
        '<div class="objeto"><div class="em">' + it.em + '</div><div class="t">' + esc(it.t) + "</div></div>" +
        '<div class="dos"><button class="op a" data-r="1"><span>🤖</span>Es IA</button><button class="op b" data-r="0"><span>🔧</span>No es IA</button></div><div id="fb"></div>';
      engancharVoz(el);
      el.querySelectorAll(".op").forEach(function (b) {
        b.addEventListener("click", function () {
          var ok = (b.dataset.r === "1") === it.ia;
          el.querySelectorAll(".op").forEach(function (x) { x.disabled = true; });
          if (!ok) L.errores++;
          sonido(ok ? "bien" : "mal");
          var fb = $("#fb", el);
          fb.innerHTML = '<div class="aviso ' + (ok ? "bien" : "mal") + '"><b>' + (ok ? "¡Bien! " : "Casi… ") + (it.ia ? "Sí es IA." : "No es IA.") + "</b>" + esc(it.por) + '</div><div class="abajo"><button class="boton">' + (i < p.items.length - 1 ? "Otra" : "Seguir") + "</button></div>";
          fb.querySelector(".boton").addEventListener("click", function () { if (i < p.items.length - 1) { i++; dibujar(); } else siguiente(); });
          fb.scrollIntoView({ behavior: "smooth", block: "end" });
        });
      });
    }
    dibujar();
  }

  function pCarta(p, el) {
    var c = CARTAS.filter(function (x) { return x.id === p.id; })[0];
    var nueva = S.cartas.indexOf(c.id) < 0 && L.nuevas.indexOf(c.id) < 0;
    el.innerHTML = '<div class="tipo">' + (nueva ? "¡Carta de poder nueva!" : "Carta de poder") + '</div><h2>Toca la carta para darle la vuelta</h2>' +
      '<div class="carta-zona"><button class="carta" aria-label="Voltear carta"><div class="cara atras">?</div><div class="cara frente"><span class="n">IAVENTURA · ' + String(CARTAS.indexOf(c) + 1).padStart(2, "0") + '</span><span class="em">' + c.em + "</span><h3>" + esc(c.t) + "</h3><p>" + esc(c.d) + "</p></div></button></div>" +
      '<div class="abajo"><button class="boton sec" data-h>🔊 Escuchar</button><button class="boton uva" disabled data-g>¡La guardo en mi álbum!</button></div>';
    var carta = el.querySelector(".carta");
    carta.addEventListener("click", function () {
      if (carta.classList.contains("vuelta")) return;
      carta.classList.add("vuelta"); sonido("carta");
      el.querySelector("[data-g]").disabled = false;
      if (L.nuevas.indexOf(c.id) < 0 && S.cartas.indexOf(c.id) < 0) L.nuevas.push(c.id);
    });
    el.querySelector("[data-h]").addEventListener("click", function () { hablar(c.t + ". " + c.d); });
    el.querySelector("[data-g]").addEventListener("click", siguiente);
  }

  function pEntrena(p, el) {
    var FICHAS = [["🐶", 1, "perro"], ["🚗", 0, "coche"], ["🐱", 1, "gato"], ["🍕", 0, "pizza"], ["⚽", 0, "balón"], ["🐸", 1, "rana"], ["🌵", 0, "cactus"], ["🦜", 1, "perico"]];
    var sel = {};
    function dibujar() {
      el.innerHTML = '<div class="tipo">Minijuego · Entrena a Bit</div>' +
        globo("Quiero aprender qué es un ANIMAL. Toca todos los animales para enseñarme con ejemplos.", "piensa") +
        '<div class="rejilla">' + FICHAS.map(function (f, i) { return '<button class="ficha' + (sel[i] ? " sel" : "") + '" data-i="' + i + '" aria-pressed="' + !!sel[i] + '" aria-label="' + f[2] + '">' + f[0] + "</button>"; }).join("") + "</div>" +
        '<div class="abajo"><button class="boton" data-ent ' + (Object.keys(sel).length ? "" : "disabled") + ">Enseñarle a Bit (" + Object.keys(sel).length + ")</button></div>";
      engancharVoz(el);
      el.querySelectorAll(".ficha").forEach(function (b) {
        b.addEventListener("click", function () { var i = b.dataset.i; if (sel[i]) delete sel[i]; else sel[i] = 1; dibujar(); });
      });
      el.querySelector("[data-ent]").addEventListener("click", probar);
    }
    function probar() {
      var malas = Object.keys(sel).filter(function (i) { return !FICHAS[i][1]; });
      var buenas = Object.keys(sel).filter(function (i) { return FICHAS[i][1]; });
      el.innerHTML = '<div class="tipo">Minijuego · Entrena a Bit</div>' + globo("Mmm… aprendiendo… ahora mira esta foto nueva…", "piensa") +
        '<div class="objeto"><div class="em">🐢</div><div class="t">¿Qué es esto?</div></div>';
      el.querySelector(".bit").classList.add("piensa");
      setTimeout(function () {
        var html, ok = false;
        if (malas.length) {
          var m = FICHAS[malas[0]];
          L.errores++; sonido("mal");
          html = globo("¡Ya sé! Un animal es algo como… ¡una " + m[2] + "! " + m[0] + " ¿La tortuga es " + m[2] + "?", "ups") +
            '<div class="aviso mal"><b>¡Bit aprendió chueco!</b>Le enseñaste que ' + (m[2] === "pizza" || m[2] === "rana" ? "la " : "el ") + m[2] + " es un animal. Una IA aprende de los ejemplos (los <b style=\"display:inline;font-size:inherit\">datos</b>) que le das. Si los datos están mal, aprende mal.</div>" +
            '<div class="abajo"><button class="boton" data-otra>Volver a enseñarle</button></div>';
        } else if (buenas.length < 4) {
          L.errores++; sonido("mal");
          html = globo("Mmm… ¿una piedra verde con patas? No estoy seguro.", "ups") +
            '<div class="aviso mal"><b>Le faltaron ejemplos</b>Solo le enseñaste ' + buenas.length + " de los 4 animales. Entre más ejemplos buenos le das a una IA, mejor aprende.</div>" +
            '<div class="abajo"><button class="boton" data-otra>Darle más ejemplos</button></div>';
        } else {
          ok = true; sonido("bien");
          html = globo("¡Es un ANIMAL! 🐢 Una tortuga. Nunca la había visto, pero aprendí con tus ejemplos.", "wow") +
            '<div class="aviso bien"><b>¡Lo entrenaste!</b>Así aprenden las IA de verdad: les muestran muchos ejemplos (datos) y descubren el patrón solas.</div>' +
            '<div class="abajo"><button class="boton">Seguir</button></div>';
        }
        el.innerHTML = '<div class="tipo">Minijuego · Entrena a Bit</div>' + html;
        engancharVoz(el);
        var b = el.querySelector(".abajo .boton");
        b.addEventListener("click", function () { if (ok) siguiente(); else { sel = {}; dibujar(); } });
      }, 1300);
    }
    dibujar();
  }

  function pOrden(p, el) {
    var FILAS = [
      { q: "¿Sobre quién es el cuento?", ops: ["algo", "un perro", "Pipo, un perro astronauta"] },
      { q: "¿Para quién es?", ops: ["para nadie en especial", "para un niño", "para mi hermanita de 8 años"] },
      { q: "¿Cómo lo quieres?", ops: ["como sea", "cortito", "cortito, chistoso y con final feliz"] }
    ];
    var el_ = [null, null, null];
    function dibujar() {
      var listo = el_.every(function (x) { return x !== null; });
      el.innerHTML = '<div class="tipo">Minijuego · Arma la orden</div>' +
        globo("¡Quiero escribirte un cuento! Pero dime bien qué quieres. Elige una opción de cada grupo.", "feliz") +
        FILAS.map(function (f, r) {
          return '<div class="fila"><div class="q">' + esc(f.q) + '</div><div class="chips">' + f.ops.map(function (o, k) { return '<button class="chip' + (el_[r] === k ? " sel" : "") + '" data-r="' + r + '" data-k="' + k + '">' + esc(o) + "</button>"; }).join("") + "</div></div>";
        }).join("") +
        '<div class="abajo"><button class="boton uva" data-dar ' + (listo ? "" : "disabled") + ">Darle la orden a Bit</button></div>";
      engancharVoz(el);
      el.querySelectorAll(".chip").forEach(function (b) { b.addEventListener("click", function () { el_[+b.dataset.r] = +b.dataset.k; dibujar(); }); });
      el.querySelector("[data-dar]").addEventListener("click", resultado);
    }
    function resultado() {
      var punt = el_[0] + el_[1] + el_[2];
      var est = punt <= 2 ? 1 : punt <= 4 ? 2 : 3;
      var orden = "Escribe un cuento sobre " + FILAS[0].ops[el_[0]] + ", " + FILAS[1].ops[el_[1]] + ", " + FILAS[2].ops[el_[2]] + ".";
      var cuento = [
        "Había una vez… algo. Y ese algo hizo cosas. Fin.",
        "Había una vez un perro que vivía en una casa. Un día ladró. Fin.",
        "Pipo, el perro astronauta, se puso su casco y despegó hacia la Luna para buscar el hueso más grande del universo."
      ][el_[0]];
      if (el_[2] === 2) cuento += el_[0] === 2 ? " ¡Lo encontró y era de queso lunar! Regresó a casa y lo compartió con todos sus amigos. 🚀🦴" : " Y al final todos se rieron mucho y fueron felices. 😄";
      if (el_[2] === 0) cuento += " Luego pasó otra cosa. Y otra. Y otra más. Y otra…";
      if (est < 3) L.errores++;
      sonido(est === 3 ? "bien" : "mal");
      el.innerHTML = '<div class="tipo">Minijuego · Arma la orden</div>' +
        '<div class="orden"><small>Tu orden (prompt)</small>' + esc(orden) + "</div>" +
        globo(est === 3 ? "¡Con esa orden sí supe qué hacer!" : "Hice lo que pude con lo que me dijiste…", est === 3 ? "wow" : "ups") +
        '<div class="cuento">' + esc(cuento) + "</div>" +
        '<div class="estrellas" aria-label="' + est + ' de 3 estrellas">' + [1, 2, 3].map(function (n) { return n <= est ? "⭐" : '<span class="no">⭐</span>'; }).join("") + "</div>" +
        '<div class="aviso ' + (est === 3 ? "bien" : "mal") + '"><b>' + (est === 3 ? "¡Orden perfecta!" : "Le faltaron detalles") + "</b>" + (est === 3 ? "Dijiste sobre quién, para quién y cómo. Así se le habla a una IA." : "Entre más clara y detallada la orden, mejor responde la IA. Prueba eligiendo las opciones con más detalles.") + "</div>" +
        '<div class="abajo">' + (est < 3 ? '<button class="boton uva" data-mejorar>Mejorar mi orden</button>' : "") + '<button class="boton' + (est < 3 ? " sec" : "") + '" data-seguir>Seguir</button></div>';
      engancharVoz(el);
      var m = el.querySelector("[data-mejorar]"); if (m) m.addEventListener("click", dibujar);
      el.querySelector("[data-seguir]").addEventListener("click", siguiente);
    }
    dibujar();
  }

  function pVerdad(p, el) {
    var i = 0;
    function dibujar() {
      var it = p.items[i];
      el.innerHTML = '<div class="tipo">Minijuego · ¿Verdad o invento? · ' + (i + 1) + " de " + p.items.length + "</div>" +
        globo(it.t, "feliz", true) +
        '<p style="margin:0;font-weight:700;color:var(--tinta2);text-align:center">A veces Bit inventa cosas. ¿Esto es cierto?</p>' +
        '<div class="dos"><button class="op a" data-r="1"><span>✅</span>Es verdad</button><button class="op b" data-r="0"><span>🌀</span>Bit lo inventó</button></div><div id="fb"></div>';
      engancharVoz(el);
      el.querySelectorAll(".op").forEach(function (b) {
        b.addEventListener("click", function () {
          var ok = (b.dataset.r === "1") === it.v;
          el.querySelectorAll(".op").forEach(function (x) { x.disabled = true; });
          if (!ok) L.errores++;
          sonido(ok ? "bien" : "mal");
          var fb = $("#fb", el);
          fb.innerHTML = '<div class="aviso ' + (ok ? "bien" : "mal") + '"><b>' + (ok ? "¡Me cachaste!" : "¡Te engañé!") + "</b>" + esc(it.por) + '</div><div class="abajo"><button class="boton">' + (i < p.items.length - 1 ? "Otra" : "Seguir") + "</button></div>";
          if (ok && it.v) fb.querySelector("b").textContent = "¡Bien!";
          fb.querySelector(".boton").addEventListener("click", function () { if (i < p.items.length - 1) { i++; dibujar(); } else siguiente(); });
          fb.scrollIntoView({ behavior: "smooth", block: "end" });
        });
      });
    }
    dibujar();
  }

  function terminar() {
    var est = L.errores <= 1 ? 3 : L.errores <= 4 ? 2 : 1;
    var antes = S.hechas.l1 || 0;
    var ganadas = Math.max(0, est - antes);
    S.hechas.l1 = Math.max(antes, est);
    S.estrellas += ganadas;
    L.nuevas.forEach(function (id) { if (S.cartas.indexOf(id) < 0) S.cartas.push(id); });
    marcarDia(); guardar();
    var desbloq = ACCS.filter(function (a) { return a[3] > S.estrellas - ganadas && a[3] <= S.estrellas && a[3] > 0; });
    var nuevas = CARTAS.filter(function (c) { return L.nuevas.indexOf(c.id) >= 0; });
    var el = $("#escena");
    document.querySelectorAll("#leccion .barra i").forEach(function (b) { b.className = "ya"; });
    el.innerHTML = '<div class="final" style="display:grid;gap:14px">' + bitEl("wow", "brinca") +
      "<h2>¡Lección completa!</h2>" +
      '<div class="estrellas" aria-label="' + est + ' de 3 estrellas">' + [1, 2, 3].map(function (n) { return n <= est ? "⭐" : '<span class="no">⭐</span>'; }).join("") + "</div>" +
      (ganadas ? '<p style="margin:0;font-weight:800">Ganaste ' + ganadas + " ⭐ para el taller de Bit" + (desbloq.length ? " y desbloqueaste: " + desbloq.map(function (a) { return a[1] + " " + a[2]; }).join(", ") : "") + "</p>" : '<p style="margin:0;font-weight:700;color:var(--tinta2)">Ya tenías estas estrellas. ¡Buen repaso!</p>') +
      (nuevas.length ? '<div class="gana">' + nuevas.map(function (c) { return '<div class="mini"><span class="em">' + c.em + "</span><b>" + esc(c.t) + "</b></div>"; }).join("") + "</div>" : "") +
      '<div class="mision"><small>Misión de la vida real</small>Con un adulto, pídele a una IA un cuento sobre tu mascota o tu juguete favorito. Primero con una orden cortita… y luego con 3 detalles más. ¿Cuál quedó mejor?</div>' +
      '<p style="margin:0;font-weight:700;color:var(--tinta2)">🔋 A Bit le quedan 2 lecciones de batería por hoy.</p>' +
      '<div class="abajo"><button class="boton uva" data-mapa>Volver al mapa</button></div></div>';
    el.querySelector("[data-mapa]").addEventListener("click", function () {
      $("#leccion").remove(); document.body.style.overflow = ""; L = null; vista = "mapa"; pintar(); window.scrollTo(0, 0);
    });
    sonido("carta"); confeti();
  }

  // ---------- Confeti ----------
  function confeti() {
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var cv = $("#confeti"), cx = cv.getContext("2d"); cv.hidden = false;
    cv.width = innerWidth; cv.height = innerHeight;
    var cols = ["#ffc531", "#ff5c8a", "#2fcf85", "#2ec4d6", "#7b61ff"];
    var ps = []; for (var i = 0; i < 140; i++) ps.push({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: 4 + Math.random() * 6, c: cols[i % 5], a: Math.random() * 6 });
    var t = 0;
    (function cuadro() {
      cx.clearRect(0, 0, cv.width, cv.height);
      ps.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.a += .1; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore(); });
      if (++t < 170) requestAnimationFrame(cuadro); else { cx.clearRect(0, 0, cv.width, cv.height); cv.hidden = true; }
    })();
  }

  pintar();
})();
</script>
